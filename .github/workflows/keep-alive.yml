name: Keep Render awake

on:
  schedule:
    - cron: "*/10 12-23,0-3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping health (tolera suspension o dormido)
        run: |
          code=""
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L \
              --connect-timeout 10 --max-time 120 \
              https://wastetoenergyproject.onrender.com/ || true)
            echo "Intento $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::warning::Servicio dormido o suspendido (HTTP $code). No es un fallo del workflow."
          exit 0
